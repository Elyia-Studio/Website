name: Publier les articles du blog

# Chaque mercredi. GitHub compte en UTC : 5 h UTC = 7 h à Genève en été,
# 6 h UTC = 7 h à Genève en hiver. Le script vérifie l'heure de Genève,
# donc un seul des deux passages publie, l'autre ne fait rien.
on:
  schedule:
    - cron: "0 5 * * 3"
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier-blog
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publier les articles du jour
        run: python3 scripts/publier_articles.py
      - name: Enregistrer et pousser
        run: |
          if [ ! -f .publies.txt ]; then echo "Rien à publier."; exit 0; fi
          titres="$(cat .publies.txt)"; rm .publies.txt
          git config user.name "Elyia publication"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blog : publication de « ${titres} »" -m "Publication automatique du mercredi depuis _a-paraitre/."
          git push
